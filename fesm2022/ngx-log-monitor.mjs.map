
@if (title) {
  <div class="title-bar" [ngClass]="theme+'-theme'">&#9002; {{title}}</div>
}
<div
  #container
  class="container"
  [ngClass]="theme+'-theme'"
  >
  @for (log of _history; track log) {
    <span
      class="msg-item {{'msg-'+(log.type.toLowerCase())}}"
      [ngClass]="{'animated': animated}"
      >
      @if (icons) {
        <span>
          @switch (log.type) {
            @case ('ERR') {
              &#10008;
            }
            @case ('SUCCESS') {
              &#10004;
            }
            @case ('LOG') {
              &#10097;
            }
            @case ('WARN') {
              &#8252;
            }
            @case ('INFO') {
              &#8505;
            }
          }
        </span>
      }
      [{{log.timestamp}}]: {{log.message}}
    </span>
  }

</div>
